<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" dir="{{ default `ltr` .Language.LanguageDirection }}">
    <head>
        {{- partial "head/head.html" . -}}
        {{- block "head" . -}}{{ end }}
    </head>
    <body class="{{ block `body-class` . }}{{ end }}">
        {{- partial "head/colorScheme" . -}}

        <div class="global-backzone" aria-hidden="true">
            <button type="button" class="global-backzone__button" aria-label="Go back"><span>← back</span></button>
            <a class="global-backzone__top" href="#top" aria-label="Scroll to top">⌁ top</a>
        </div>

        <div class="container main-container flex on-phone--column compact">
            <main class="main full-width">
                {{- block "main" . }}{{- end }}
            </main>
            {{- block "right-sidebar" . -}}{{ end }}
        </div>
        {{ partial "footer/include.html" . }}

        <script>
            (function () {
                const backButton = document.querySelector('.global-backzone__button');
                if (backButton) {
                    backButton.addEventListener('click', function (event) {
                        event.preventDefault();
                        if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            window.location.href = '/';
                        }
                    });
                }

                const topLink = document.querySelector('.global-backzone__top');
                if (topLink) {
                    topLink.addEventListener('click', function (event) {
                        event.preventDefault();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                }
            })();
        </script>
    </body>
</html>
